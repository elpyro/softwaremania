[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Formspree necesita el Referer para poder restringir el formulario al dominio.
# Este valor es el que espera su opción "Restrict to Domain".
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
